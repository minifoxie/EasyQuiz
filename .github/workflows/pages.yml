name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Commits for Static API
        run: |
          TOTAL=$(git rev-list --count HEAD)
          echo "{\"total\": $TOTAL}" > docs/meta.json
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits?per_page=100" > docs/commits.json

      - name: Generate canonical bookmarklets
        run: node scripts/generate-bookmarklets.mjs

      - name: Bust static asset URLs
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i -E "s/([?&]v=)[^\"'& ]+/\1${VERSION}/g" docs/index.html

      - name: Publish docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
